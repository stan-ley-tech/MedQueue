name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          diff <(gofmt -l .) <(echo -n "")
      - name: go vet
        run: go vet ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests with race detector
        run: go test ./internal/... -race -count=1 -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medqueue
          POSTGRES_PASSWORD: medqueue
          POSTGRES_DB: medqueue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medqueue -d medqueue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://medqueue:medqueue@localhost:5432/medqueue_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
      DATABASE_URL: postgres://medqueue:medqueue@localhost:5432/medqueue_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration tests
        run: go test ./tests/integration/... -race -count=1 -tags=integration -v
      - name: Run e2e tests
        run: go test ./tests/e2e/... -count=1 -tags=e2e -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binaries
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker
          go build -o bin/migrate ./cmd/migrate

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: medqueue-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: medqueue-worker:ci
